services:
  fluentbit:
    build:
      context: ../../
      dockerfile: dockerfiles/Dockerfile
      target: production
    depends_on:
      - otel-collector
    command: /fluent-bit/bin/fluent-bit -c /etc/fluent-bit.yaml
    networks:
      - otel-network
    volumes:
      - ./config/fluent-bit.yaml:/etc/fluent-bit.yaml:ro
      # The journal itself, plus the machine-id that sd-journal needs to
      # resolve the local machine's journal files.
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    networks:
      - otel-network
    ports:
      - 4318:4318
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro

networks:
  otel-network:
    driver: bridge
